version: '3.8'
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    volumes:
      - ./docker/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_ENABLE_IDEMPOTENCE: "true"
      KAFKA_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: 5
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.0-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Secure integration profile: `docker compose --profile secure up -d` ---
  # Requires ./docker/generate-test-certs.sh. Mirrors the production setup
  # (TLS + AUTH) with throw-away certificates; the default services above stay
  # plaintext for local development (SCP_ALLOW_INSECURE_LOCAL=true).
  redis-secure:
    image: redis:8.10.0-alpine
    profiles: ["secure"]
    ports:
      - "6380:6380"
    volumes:
      - ./docker/certs:/certs:ro
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.pem
      - --tls-key-file
      - /certs/server-key.pem
      - --tls-ca-cert-file
      - /certs/ca.pem
      - --tls-auth-clients
      - "no"
      - --requirepass
      - test-redis-password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /certs/ca.pem -p 6380 -a test-redis-password ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-secure:
    image: apache/kafka:4.3.1
    profiles: ["secure"]
    ports:
      - "9094:9094"
    volumes:
      - ./docker/certs:/certs:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The listener is named SECURE (not SASL_SSL) because the image's entrypoint
      # otherwise demands JKS keystore secrets whenever it sees an "SSL://" listener.
      KAFKA_LISTENERS: SECURE://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SECURE://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SECURE:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SECURE
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SECURE_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="scp" password="scp-secret" user_scp="scp-secret";
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/server-keystore.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Used only as a libp2p GossipSub reserved peer for pubsub-broadcaster
  # integration testing (no longer used for telemetry batch storage).
  ipfs:
    image: ipfs/kubo:v0.42.0
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    command: ["daemon", "--enable-pubsub-experiment"]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5

  robonomics:
    image: robonomics/robonomics:sha-815c7c0
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD-SHELL", "curl -H 'Content-Type: application/json' -d '{\"id\":1, \"jsonrpc\":\"2.0\", \"method\": \"system_health\"}' http://localhost:9944 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

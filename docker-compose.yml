version: '3.8'
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    volumes:
      - ./docker/kafka-init-topics.sh:/kafka-init-topics.sh:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_ENABLE_IDEMPOTENCE: "true"
      KAFKA_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: 5
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.0-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Used only as a libp2p GossipSub reserved peer for pubsub-broadcaster
  # integration testing (no longer used for telemetry batch storage).
  ipfs:
    image: ipfs/kubo:v0.42.0
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    command: ["daemon", "--enable-pubsub-experiment"]
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5

  robonomics:
    image: robonomics/robonomics:v4.3.0
    command: ["robonomics", "--dev", "--rpc-external"]
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD-SHELL", "curl -H 'Content-Type: application/json' -d '{\"id\":1, \"jsonrpc\":\"2.0\", \"method\": \"system_health\"}' http://localhost:9944 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

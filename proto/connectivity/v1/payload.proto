syntax = "proto3";

package connectivity.v1;

// TelemetryAuthorizedPayload is emitted when sensor telemetry passes validation.
message TelemetryAuthorizedPayload {
  // 32-byte sensor public key (Ed25519)
  bytes sensor_id = 1;
  
  // Raw message from sensor 
  bytes signed_envelope = 2;
}

// TelemetryRejectedPayload is emitted when sensor telemetry fails validation.
message TelemetryRejectedPayload {
  // Optional sensor ID (may be missing if signature invalid)
  optional bytes sensor_id = 1;
  
  // Machine-readable rejection code
  uint32 reason_code = 2;
  
  // Optional human-readable message
  string reason_message = 3;
}

// TelemetryBatchedPayload carries a chain-ready batch of authorized telemetry.
// It is emitted by the batcher and consumed directly by blockchain-anchor.
// `payload` is the exact byte sequence passed to CPS.set_payload: an XZ
// compressed, serialized crypto.v1.SignedEnvelopeBatch with no additional
// framing. Payload interpretation (schema/encoding/compression) is described
// through CPS metadata, not through bytes embedded in the payload itself.
message TelemetryBatchedPayload {
  // Unique batch identifier (logical batch identity, used for deduplication)
  string batch_id = 1;

  // Chain-ready payload: XZ(serialized crypto.v1.SignedEnvelopeBatch).
  // This is exactly the byte sequence passed to CPS.set_payload.
  bytes payload = 2;

  // Number of events in the batch
  uint32 event_count = 3;

  // Sensor IDs present in the batch (observability)
  repeated bytes sensor_ids = 4;

  // Size of the serialized SignedEnvelopeBatch before compression (observability)
  uint32 uncompressed_size = 5;

  // Size of `payload` in bytes; must always be <= ANCHOR_MAX_PAYLOAD_BYTES
  uint32 compressed_size = 6;

  // blake2_256 hash of `payload`, useful for diagnostics/idempotency checks
  bytes payload_hash = 7;
}
